        <h1 class="cc-article-title">A brand is a list of decisions. I studied Anthropic’s.</h1>
        <div class="cc-article-meta">
          <span>Libbie Frost</span>
          <span>Nov 2026</span>
        </div>
      </div>

      <div class="cc-article-body" id="cc-article-body"></div>

  <script>
    var BASE = 'https://creativeconviction.ai/writing/anthropic-brand/';
    var MD = "Anthropic spent less than 4% of its revenue on advertising and still built one of the strongest brands in tech. It got there by making decisions that matched its values, over and over, for five years.\n\nThat's the test I think every brand should be measured by. A brand's strength is the gap between the identity it claims and the actions it takes, and the strongest brands keep that gap small. Anthropic is an easy company to test, because it wrote its identity down. Its [IPO letter](https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm) promises to \"underpromise and overdeliver\" and to be \"bold but sane,\" and its [careers](https://www.anthropic.com/careers) page lists seven values, from hold light and shade to put the mission first.\n\nSo I went back through Anthropic's history, from a 2021 homepage with no product to this week's opening bell, and checked its brand decisions against its own promises. Here are a few things that surprised me.\n\n*Disclosure. Bessemer Venture Partners is an investor in Anthropic. All my sources are public info.*\n\n## The “yes” decisions that built the brand\n\n**The identity came before the product.** The default startup move is to design a brand after you find something to sell. Anthropic, correctly, did it the other way around. In 2021, before Claude existed, the founders hired [Geist](https://geist.co/work/anthropic) to build a wordmark, type and color system for a research lab with no product. Its first [announcement](https://www.anthropic.com/news/anthropic-raises-124-million-to-build-more-reliable-general-ai-systems) and its 2021 [homepage](http://web.archive.org/web/20211201214356/https://www.anthropic.com/) had no chatbot to show, only a company describing what it believes. That’s *“put the mission first”* before there was anything to sell.\n\n**The beliefs arrived as essays.** Anthropic [published](https://www.anthropic.com/news/core-views-on-ai-safety) Core Views on AI Safety in March 2023, days before Claude launched, so its first public statement about a product was unexpectedly an argument about risk. This aligns with how a *“values-driven organization”* should introduce itself. Dario’s essay [Machines of Loving Grace](https://www.darioamodei.com/essay/machines-of-loving-grace) later supplied the bold half of *“bold but sane,”* and the Claude [constitution](https://www.anthropic.com/constitution) published the values so anyone and everyone can hold Anthropic accountable.\n\n**The research was made interactive.** One of my favorite earliest examples of this was when it published its interpretability findings in [Scaling Monosemanticity](https://transformer-circuits.pub/2024/scaling-monosemanticity/), then turned them into [Golden Gate Claude](https://www.anthropic.com/news/golden-gate-claude). For a short window, anyone could chat with a model tuned to obsess over the bridge. Choosing the bridge much of their audience calls home made the research feel personal, and a few minutes of chatting with it communicated more than the paper could explain. The principle of being *“helpful, honest and harmless”* became something you could poke at yourself.\n\n**Paid media came late, after the product had earned it.** Anthropic’s first brand campaign, [Keep thinking](https://x.com/claudeai/status/1968705632095158393) (made with [Mother](https://www.motherlondon.com/work/claude-keep-thinking)) arrived in September 2025, a whopping two and a half years after Claude’s March 2023 debut! The [push](https://www.axios.com/2025/09/18/anthropic-brand-campaign-claude) was anchored by a 90-second film directed by Daniel Wolfe and ran during live sports and on Netflix and Hulu, alongside print in the NYT and WSJ, podcasts and billboards in about a dozen cities. Its line was “There has never been a better time to be a problem solver,” and it pitched Claude as a partner for thinking hard instead of a shortcut around it.\n\n<iframe class=\"cc-video\" src=\"https://www.youtube.com/embed/FDNkDBNR7AM?si=eDiXJmPxfe3q3iY8\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen><\/iframe>\n\n**The offline activations stayed on message.** I vividly remember being in New York’s West Village and seeing how Anthropic turned the Air Mail newsstand into a Claude [café](https://the-decoder.com/anthropics-marketing-department-opens-zero-slop-zone-in-new-york/), where it also handed out the Thinking caps. The obvious hat choice would say Claude on the front in big letters, but this didn’t say Claude anywhere the “Iykyk” came from the campaign and font. Then, at San Francisco’s [de Young](https://www.linkedin.com/posts/greg-feingold-3a890a91_this-is-claude-monet-an-interactive-experience-activity-7441146270204923904-tRBA) Museum, it paired with the Monet and Venice exhibition so visitors could type questions to Claude on vintage typewriters.\n\n<img class=\"cc-article-img cc-article-img--last\" src=\"air-mail.jpg?v=3\" alt=\"A man in a thinking cap reads a book outside the Claude café at the Air Mail newsstand\" width=\"1260\" height=\"834\" />\n\n**The Ants’ own screens became the footage.** Every company builds trust with customer quotes and case studies, but Anthropic cuts to the chase with the strongest proof there is… its own team using the product in public. It turns its [“prototypes over docs”](https://www.lennysnewsletter.com/p/how-anthropics-product-team-moves) culture into distribution - insanely fast distribution. It ships fast enough that Cowork [came](https://axios.com/2026/01/13/anthropic-claude-code-cowork-vibe-coding) together in ten days, built largely with Claude Code. Around the same time, if you’re like me, you probably remember Boris Cherny, Head of Claude Code, showing up everywhere in your feed. He did three major shows in 15 days ([YC](https://www.youtube.com/watch?v=PQU9o_5rHC4), [Lenny’s](https://www.youtube.com/watch?v=We7BZVKbCVw), [Pragmatic Engineer](https://podwise.ai/episodes/7381474)), all while posting raw [screenshots](https://x.com/bcherny/status/2007179832300581177) of his own terminal setup. Claims about shipping dozens of pull requests a day and coding being [“solved”](https://www.youtube.com/watch?v=We7BZVKbCVw) set off debates across engineering teams. Meanwhile, Claude Code’s run rate [grew](https://fourweekmba.com/ai-claude-code-run-rate-agentic-layer/) from about $1B to $8B in six months. The simplest marketing was letting people watch, which is *“do the simple thing that works”* at its best.\n\n<blockquote class=\"twitter-tweet\"><p lang=\"en\" dir=\"ltr\">I'm Boris and I created Claude Code. Lots of people have asked how I use Claude Code, so I wanted to show off my setup a bit.<br><br>My setup might be surprisingly vanilla! Claude Code works great out of the box, so I personally don't customize it much. There is no one correct way to use Claude Code: we intentionally build it in a way that you can use it, customize it, and hack it however you like. Each person on the Claude Code team uses it very differently.<br><br>So, here goes.<\/p>&mdash; Boris Cherny (@bcherny) <a href=\"https://x.com/bcherny/status/2007179832300581177?ref_src=twsrc%5Etfw\">January 2, 2026<\/a><\/blockquote>\n\n**Anthropic stood by its values even when it cost a contract.** The most expensive brand decision came in February 2026. The Pentagon asked Anthropic to remove two rules from its contract, one barring the use of Claude for fully autonomous weapons and one barring mass surveillance of Americans, and to allow “any [lawful](https://analyticsindiamag.com/ai-news/anthropic-rejects-pentagon-demand-to-allow-any-lawful-use-of-ai) use” instead. Dario [wrote](https://anthropic.com/news/statement-department-of-war) that the company could not “in good conscience accede,” and the Pentagon moved its work [elsewhere](https://pureai.com/Articles/2026/03/02/Pentagon-Dumps-Anthropic.aspx). It *“put the mission first”*, no matter the opportunity cost.\n\n**The Ants kept publishing their homework.** Showing the work kept going after Claude Code took off. In October 2026 Anthropic [published](https://www.anthropic.com/research/redesigning-source-control) how it fully migrated its monorepo off Git in five months. It also [shared](https://www.anthropic.com/research/employment-at-anthropic) how work is changing inside the company, where monthly coding sessions with agents among non-technical employees went from 2 to 90 in under a year. It shows up in the numbers too… Anthropic generated $6.6M in TTM revenue per employee, per its [S-1](https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm). Builders multiplying their own output has become one of its strongest growth engines.\n\nThe ownership structure matched the mission. A week before filing to go public, Anthropic [committed](https://www.anthropic.com/news/public-benefit-fund) 5% of its shares to a Public Benefit Fund. Up to 2% more can be added as the company’s value grows. This is turning its value “act for the global good” into an obligation.\n\n**The Ants left their mark.** I’ll admit, “culture matters” can sound like a soft take, but it’s a take I love and I’m glad to see it shine in the [S-1](https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm). “Talent & culture” comes right after “Mission & focus” in the list of Anthropic’s core advantages. The founders’ letter also says, “It starts with Anthropic’s culture….” You can feel it even in the [careers](https://www.anthropic.com/careers) page, which invites you in and features a long conversation among the co-founders that is like sitting in their living room. That culture leaks into the product in small, unserious ways too. While Claude Code works, its spinner cycles through verbs like “Schlepping” and “Clauding,” and a retro pixel mascot named [Clawd](https://www.starkinsider.com/2025/10/clawd-ai-retro-mascot-command-line.html) greets you in the terminal. I’m confident that no users deliberately asked for these, but the team crafted it anyway. And fans love it, enough to build sites like the [Claudionary](https://claudionary.com/) and [The Verbs of Claude](https://verbs-of-claude.pages.dev/all-verbs). A competitor can copy paste a design system and reverse engineer code, but it can’t copy paste culture.\n\n<div class=\"cc-scroll\"><img class=\"cc-article-img\" src=\"core-advantages.png\" alt=\"Excerpt from the S-1, Our Core Advantages: Mission and Focus, and Talent and Culture\" width=\"1302\" height=\"344\" /></div>\n\n## The “no” decisions that protected the brand\n\nIf alignment shows up in what a company does, it also shows up in what it declines to do. Some of Anthropic’s absences are among its best brand decisions.\n\n**Less robot, more human.** Big tech dressed its AI in light, motion and gradients, the visual language of magic. Anthropic made Claude feel handmade. Its colors are clay orange with kraft and fig tones, while rivals chase cold blues and electric purples. Its textures are cream paper and illustrations that look like colored pencil, while rivals polish everything to a glossy glow. Its serif body text reads like a literary magazine, while most tech runs on clean sans. Its logo is a lopsided starburst drawn as if by pen, while rival marks are perfect circles and tight geometry. Its launch films carry warm, upbeat music - it even has Claude FM, a 24/7 stream “made and curated by musicians.” [Geist](https://geist.co/work/anthropic), the studio behind the identity, says the goal was to “bring warmth to the brand” in “a category rife with tech tropes.” The result is an AI that looks and sounds like it belongs on your desk at home, next to your notebook and cup of coffee. The name decisions follow the same pattern. Anthropic comes from the Greek for human, Claude is a first name, and the models are literary forms, from Haiku to Opus to Fable. The company rarely explains them and leaves the [interpreting](https://news.ycombinator.com/item?id=48480852) to us. Those easter eggs keep people debating the brand long after launch.\n\n**Retention through invention.** The founders’ [letter](https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm) says *“we will generally devote less effort to entrenching our current products and business models, and more effort to defining new ones.”* In the spirit of aiming *“to be bold but sane,”* milking products for profit and cross-sell is the Wall Street SaaS investor’s dream, so skipping it sounds bold, but in AI where products go stale in months, it’s the sane choice.\n\n**No ads inside Claude.** Also in the founder’s letter: *“Once advertising becomes part of a company’s revenue targets, the pressure to optimize for engagement tends to grow. We have chosen not to introduce that pressure into Claude.”* The company made the same case in the Claude is a [space to think](https://www.anthropic.com/news/claude-is-a-space-to-think) announcement. Advertising is the most obvious way to make money from a product people use every day, and I imagine most teams would hear “let’s promise never to run ads” and assume it was a prank. By ruling ads out in public, Anthropic gave users a reason to trust that Claude’s answers are only trying to help, which fits its *“be good to our users”*.\n\n## Where the words and actions drifted, and people pushed back\n\n“Anthropic is a company, and we will sometimes make mistakes,” reads one line in the Claude [constitution](https://www.anthropic.com/constitution). Below are a few places where the gap between the identity and the actions has been debated.\n\n**The Super Bowl ad tested the low-ego promise.** The no-ads pledge got its biggest stage in February 2026, when Anthropic [ran](https://www.linkedin.com/posts/andrewstirk_ads-are-coming-to-ai-but-not-to-claude-activity-7426683481302155266-xeq_) a spot whose message was that ads are coming to AI, but not to Claude. The principle was on brand, but the [press](https://www.eweek.com/news/anthropic-mocks-openai-super-bowl-neuron/) mostly read it as a feisty pounce at OpenAI. Sam Altman called it [“doublespeak,”](https://x.com/sama/status/2019139174339928189) and his reply drew about twice the views of Claude’s [post](https://x.com/claudeai/status/2019071113741906403). Anthropic seemed to sense the tone, and the version that aired [softened](https://aichief.com/news/anthropics-super-bowl-ad-softens-its-openaichatgpt-focus/) its focus on ChatGPT. Still, creatives interviewed by [Adweek](https://www.adweek.com/media/creatives-react-anthropics-anti-ad-stance-risks-aging-poorly/) pointed out the irony of making the case against ads… with an ad. For a few weeks the conversation centered on the rivalry more than the promise. The lesson: even a good principle can land differently when it’s aimed at someone.\n\n<blockquote class=\"twitter-tweet\"><p lang=\"en\" dir=\"ltr\">Ads are coming to AI. But not to Claude. Keep thinking. <a href=\"https://t.co/n2yECeBWyT\">https://t.co/n2yECeBWyT<\/a><\/p>&mdash; Claude (@claudeai) <a href=\"https://x.com/claudeai/status/2019071113741906403?ref_src=twsrc%5Etfw\">February 4, 2026<\/a><\/blockquote>\n\n**Hard Questions split the room.** Five months later, Anthropic released a darker film about AI risk, which its brand lead framed as “there’s hope in hard [questions](https://www.linkedin.com/posts/andrewstirk_theres-hope-in-hard-questions-over-the-activity-7481017564546990081-LcRy).” It was Anthropic’s most direct attempt to *“hold light and shade”* on screen. Personally, I liked it - it looked beautiful, felt humble, featured a wide range of voices, and told people Anthropic was listening, which builds the kind of trust most ads rarely earn. Plenty of viewers felt the same, but the loudest reactions saw only the shade. TechRadar [reported](https://techradar.com/ai-platforms-assistants/claude/i-thought-it-was-satire-sam-altman-mocks-anthropics-latest-ai-ad-thats-getting-widely-blasted-for-being-dystopian-marketing-slop) it was “widely blasted for being dystopian marketing slop,” Altman said he thought it was [satire](https://x.com/sama/status/2076824686307271125), and Fast Company [argued](https://fastcompanyme.com/co-design/advertising-isnt-the-answer-to-anthropics-hard-questions/) that advertising isn’t the answer to Anthropic’s hard questions. The frustration, as I interpreted it, was less about the film and more about who made it - people struggling to hear hard questions about AI from a company racing to build AI.\n\n<iframe class=\"cc-video\" src=\"https://www.youtube.com/embed/jVbGX7zJHi8?si=k-LLVPdZYciCT9Nc\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen><\/iframe>\n\n**Claude’s voice and look became everyone’s default.** Claude’s identity was built to stand apart and to feel like a thoughtful partner rather than a machine. The warm, honest voice did that at first, but it also gave Claude habits, and we all learned to spot “It’s not X – it’s Y.” The same thing happened to the look. The [New Yorker](https://www.newyorker.com/culture/infinite-scroll/the-ai-design-aesthetic-thats-taking-over-the-internet) described an AI design aesthetic taking over the internet, with cream backgrounds, serif type and warm accents. Some of that spread was by choice, since Anthropic even released its brand rules as an open [skill](https://github.com/anthropics/skills/blob/main/skills/brand-guidelines/SKILL.md) anyone can use. But when millions of people ask Claude to write their posts and build their sites, its voice and look end up everywhere, including in the AI slop people are tired of. A brand designed to escape tech tropes has become one. It’s a good problem to be the one setting the trends, but it raises the bar to keep reinventing.\n\n## Lessons for builders\n\nLooking back, the clearest lesson is to write your identity down early and use it to make decisions, because it turns a founder’s gut into something the whole team can use. Make it falsifiable too. A value like “be awesome” can never fail, but *“underpromise and overdeliver”* can, since one hyped-up launch and broken product proves it wasn’t followed. Then decide what you won’t do, and let people see you not-doing-it. Let your team leave fingerprints, because the details nobody asked for are often the ones people remember and share. If you’re the leader in your market, expect your look to be copied and be flattered. Stay in your lane and invest more in what can’t be copied, like your focus and culture. Anyone can borrow cream and serif type, but nobody can borrow the reason a few thousand Ants show up to work to build the future. And when you drift, and you will, the fix is the same document - go back to what you originally wrote down.\n\nCongratulations to the Ants on the IPO. I can only imagine how many late nights of pondering, percolating, and schlepping it took to get here. You put identity first and values over everything, and it got you to the opening bell faster in record time. From a Claude fan in New York, thank you for building something worth writing about. Keep thinking!";
