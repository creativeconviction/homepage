<!doctype html>
<html lang="en">
<head>

<style>
  /* The logo fills the first screen. Scrolling pulls a stream of images and quotes from the bottom of the page up through the top. The interviews wait underneath. */
  :root {
    --bg: #FFFFFF; --paper: #F7F5FA; --ink: #1A1130; --ink-2: #4A4260; --ink-3: #6A6378; --rule: #E5E1ED; --magenta: #D8016A; --magenta-deep: #B80059;
    --serif: "EB Garamond", Garamond, "Iowan Old Style", Georgia, serif; --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15121E; --paper: #1E1A2A; --ink: #F1EEF7; --ink-2: #C4BED3; --ink-3: #9790A8; --rule: #2E2940; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #15121E; --paper: #1E1A2A; --ink: #F1EEF7; --ink-2: #C4BED3; --ink-3: #9790A8; --rule: #2E2940; color-scheme: dark; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
  img { display: block; max-width: 100%; }

  /* Fixed top line: small links on the right; a small wordmark appears on the left once the big logo has scrolled away */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  .top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(16px, 3vw, 32px); font-size: 14px; }
  .top .mark { font-family: var(--serif); font-size: 20px; opacity: 0; transform: translateY(-6px); transition: opacity .3s ease, transform .3s ease; pointer-events: none; }
  .top .mark em { color: var(--magenta); }
  body.past .top .mark { opacity: 1; transform: none; pointer-events: auto; }
  .top { transition: background .3s ease; }
  body.past .top { background: var(--bg); }
  .top nav { display: flex; gap: clamp(14px, 2vw, 24px); color: var(--ink-3); }
  .top nav a:hover { color: var(--ink); }
  .top nav .sub { color: #fff; background: var(--magenta); padding: 6px 14px; }
  .top nav .sub:hover { color: #fff; background: var(--magenta-deep); }
  .top nav { align-items: center; }

  /* Hero */
  .hero { min-height: 92vh; min-height: 92svh; display: grid; place-items: center; padding: 64px clamp(16px, 5vw, 64px) 24px; }
  .logo { display: flex; flex-direction: column; align-items: center; animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .logo h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(64px, 15.5vw, 212px); line-height: .86; letter-spacing: -.035em; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .logo .l2 { font-style: italic; color: var(--magenta); margin-top: .02em; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .logo .tag { animation: rise .9s .35s cubic-bezier(.2,.7,.2,1) both; margin-top: clamp(14px, 2.5vw, 32px); font-family: var(--serif); font-size: clamp(18px, 2vw, 26px); line-height: 1.3; text-align: center; color: var(--ink); max-width: 30ch; text-wrap: balance; }

  /* The stream */
  .stream { height: 320vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
  .wall { display: grid; gap: 4px; grid-auto-flow: dense; will-change: transform; }
  .pic { overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .pic.tall { grid-row: span 2; } .pic.wide { grid-column: span 2; }
  .quote.q-xl { grid-column: span 2; grid-row: span 2; }
  .quote.q-w { grid-column: span 2; font-size: clamp(27px, 2.25vw, 36px); }
  .quote.q-t { grid-row: span 2; font-size: clamp(24px, 1.9vw, 30px); }
  .pic, .quote { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
  .pic.in, .quote.in { opacity: 1; transform: none; }
  .quote { background: var(--paper); display: flex; flex-direction: column; justify-content: center; padding: clamp(18px, 2.4vw, 36px); font-family: var(--serif); font-size: clamp(33px, 3vw, 48px); line-height: 1.25; color: var(--ink); text-wrap: pretty; }
  .quote.long { font-size: clamp(20px, 1.65vw, 27px); }
  .quote small { display: block; margin-top: 18px; font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
  .quote small b { font-weight: 400; }
  .quote small em { font-style: normal; color: var(--magenta); }

  /* Interviews */
  .interviews { padding: 24px clamp(16px, 4vw, 48px) clamp(48px, 6vw, 96px); }
  .list { list-style: none; max-width: 960px; margin: 0 auto; border-top: 1px solid var(--rule); }
  .row a { display: grid; grid-template-columns: 56px minmax(0, 1.2fr) minmax(0, 1fr) 88px; gap: 20px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--rule); transition: color .2s ease; }
  .row .ph { width: 56px; height: 56px; object-fit: cover; }
  .row .t { font-family: var(--serif); font-size: 24px; line-height: 1.15; text-align: center; }
  .row .w { color: var(--ink-3); font-size: 14px; text-align: center; line-height: 1.4; }
  .row .w b { font-weight: 400; color: var(--ink-2); }
  .row .w em { font-style: normal; color: var(--magenta); }
  .row .d { color: var(--ink-3); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
  .list:hover .row a { color: var(--ink-3); }
  .list:hover .row a .w b { color: var(--ink-3); }
  .list:hover .row a:hover, .list:hover .row a:hover .w b { color: var(--ink); }


  @media (max-width: 720px) {
    .top { padding: 10px 14px; }
    .top .mark { white-space: nowrap; }
    .top nav { gap: 10px; font-size: 12px; }
    .top nav a:first-child, .top nav a:nth-child(5) { display: none; }
    .top .mark { font-size: 16px; }
    .row a { grid-template-columns: 48px minmax(0, 1fr); gap: 4px 14px; align-items: start; }
    .row .ph { width: 48px; height: 48px; grid-row: 1 / span 3; }
    .row .t, .row .w, .row .d { grid-column: 2; text-align: left; }
    .row .t { font-size: 20px; }
    .row .d { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stream { height: auto; }
    .stage { position: static; height: auto; overflow: visible; }
    .pic, .quote { opacity: 1; transform: none; transition: none; }
    .logo, .logo .tag, .top .mark { animation: none; transition: none; }
  }
</style>

<script>const CC={"interviews": [{"url": "https://creativeconviction.ai/interviews/mihika-kapoor/", "name": "Mihika Kapoor", "headline": "Simulation is human", "role": "Head of Product", "company": "Simile", "date": "October 2026", "slug": "mihika-kapoor", "quote": "You can distill pretty much any company into: figure out what to do, then do the thing."}, {"url": "https://creativeconviction.ai/interviews/adam-ho/", "name": "Adam Ho", "headline": "Design as discography", "role": "Head of Design", "company": "fal", "date": "October 2026", "slug": "adam-ho", "quote": "I treat the projects I do like a discography, the way an artist has albums on Spotify."}, {"url": "https://creativeconviction.ai/interviews/liz-dorman/", "name": "Liz Dorman", "headline": "Couture computing in hardware", "role": "Co-founder", "company": "Era", "date": "October 2026", "slug": "liz-dorman", "quote": "We want main character energy back."}, {"url": "https://creativeconviction.ai/interviews/colin-daymond-hanna/", "name": "Colin Daymond Hanna", "headline": "Creating light in the darkness", "role": "Co-founder", "company": "Earendil", "date": "September 2026", "slug": "colin-daymond-hanna", "quote": "Black and white focuses the mind on elements even more fundamental than what we see with our own eye."}, {"url": "https://creativeconviction.ai/interviews/noah-kerner/", "name": "Noah Kerner", "headline": "We all dream", "role": "CEO", "company": "Acorns", "date": "August 2026", "slug": "noah-kerner", "quote": "Nothing profound was built off of research in the classic sense."}, {"url": "https://creativeconviction.ai/interviews/diego-segura/", "name": "Diego Segura", "headline": "Narrative before design", "role": "Founder, Creative Director", "company": "Family Office", "date": "July 2026", "slug": "diego-segura", "quote": "Design is most valuable in spaces designers don't usually care to work in. The unsexy stuff."}, {"url": "https://creativeconviction.ai/interviews/quinten-farmer/", "name": "Quinten Farmer", "headline": "Why a little alien is a good friend", "role": "Co-founder & CEO", "company": "Tolan", "date": "July 2026", "slug": "quinten-farmer", "quote": "Today we call it a second self. It's personal AI, a little character designed to be an extension of you."}, {"url": "https://creativeconviction.ai/interviews/paul-jun/", "name": "Paul Jun", "headline": "Form follows fantasy", "role": "Creative Director", "company": "Ramp", "date": "July 2026", "slug": "paul-jun", "quote": "I joke that product design is form follows function and brand design is form follows fantasy. The real opportunity is when function and fantasy share a room."}, {"url": "https://creativeconviction.ai/interviews/ben-and-zubin-raindrop/", "name": "Ben Hylak and Zubin Koticha", "headline": "Tsunami of capabilities", "role": "Co-founders", "company": "Raindrop", "date": "June 2026", "slug": "ben-hylak", "quote": "The most core part of taste is the nouns we have."}, {"url": "https://creativeconviction.ai/interviews/nir-zicherman/", "name": "Nir Zicherman", "headline": "Building the generalized learning platform", "role": "Co-founder & CEO", "company": "Oboe", "date": "June 2026", "slug": "nir-zicherman", "quote": "Not one of the platforms they regularly use was built to teach."}, {"url": "https://creativeconviction.ai/interviews/stephen-haney/", "name": "Stephen Haney", "headline": "Care that compounds", "role": "Founder & CEO", "company": "Paper", "date": "June 2026", "slug": "stephen-haney", "quote": "In design tools, the best product often wins."}, {"url": "https://creativeconviction.ai/interviews/dylan-babbs/", "name": "Dylan Babbs", "headline": "Designing for trust in new categories", "role": "Co-founder", "company": "Profound", "date": "June 2026", "slug": "dylan-babbs", "quote": "At the end of the day a company is just a group of people in a room."}]};const PORTS={"quinten-farmer": "images/home/quinten-farmer.jpg", "adam-ho": "images/home/adam-ho.jpg", "paul-jun": "images/home/paul-jun.jpg", "stephen-haney": "images/home/stephen-haney.jpg", "liz-dorman": "images/home/liz-dorman.jpg", "diego-segura": "images/home/diego-segura.jpg", "ben-hylak": "images/home/ben-hylak.jpg", "nir-zicherman": "images/home/nir-zicherman.jpg", "mihika-kapoor": "images/home/mihika-kapoor.jpg", "colin-daymond-hanna": "images/home/colin-daymond-hanna.jpg", "noah-kerner": "images/home/noah-kerner.jpg", "dylan-babbs": "images/home/dylan-babbs.jpg"};const IMGS=[{"u": "images/home/gathering-05.jpg", "w": 426, "h": 560, "n": "05"}, {"u": "images/home/gathering-11.jpg", "w": 448, "h": 560, "n": "11"}, {"u": "images/home/gathering-17.jpg", "w": 448, "h": 560, "n": "17"}, {"u": "images/home/gathering-18.jpg", "w": 315, "h": 560, "n": "18"}, {"u": "images/home/gathering-19.jpg", "w": 560, "h": 560, "n": "19"}, {"u": "images/home/gathering-20.jpg", "w": 560, "h": 287, "n": "20"}, {"u": "images/home/gathering-21.jpg", "w": 406, "h": 560, "n": "21"}, {"u": "images/home/gathering-22.jpg", "w": 391, "h": 560, "n": "22"}, {"u": "images/home/gathering-23.jpg", "w": 435, "h": 560, "n": "23"}, {"u": "images/home/gathering-24.jpg", "w": 543, "h": 560, "n": "24"}, {"u": "images/home/gathering-25.jpg", "w": 560, "h": 560, "n": "25"}, {"u": "images/home/gathering-26.jpg", "w": 560, "h": 369, "n": "26"}, {"u": "images/home/gathering-27.jpg", "w": 560, "h": 560, "n": "27"}, {"u": "images/home/gathering-28.jpg", "w": 396, "h": 560, "n": "28"}, {"u": "images/home/gathering-29.jpg", "w": 500, "h": 400, "n": "29"}, {"u": "images/home/gathering-30.jpg", "w": 560, "h": 418, "n": "30"}, {"u": "images/home/gathering-31.jpg", "w": 259, "h": 560, "n": "31"}, {"u": "images/home/gathering-32.jpg", "w": 560, "h": 560, "n": "32"}, {"u": "images/home/gathering-33.jpg", "w": 460, "h": 560, "n": "33"}, {"u": "images/home/gathering-34.jpg", "w": 448, "h": 560, "n": "34"}, {"u": "images/home/gathering-35.jpg", "w": 560, "h": 560, "n": "35"}, {"u": "images/home/gathering-36.jpg", "w": 560, "h": 560, "n": "36"}, {"u": "images/home/gathering-37.jpg", "w": 557, "h": 560, "n": "37"}, {"u": "images/home/gathering-38.jpg", "w": 420, "h": 560, "n": "38"}, {"u": "images/home/gathering-39.jpg", "w": 293, "h": 450, "n": "39"}, {"u": "images/home/gathering-40.jpg", "w": 560, "h": 364, "n": "40"}, {"u": "images/home/gathering-41.jpg", "w": 560, "h": 322, "n": "41"}, {"u": "images/home/gathering-42.jpg", "w": 560, "h": 476, "n": "42"}, {"u": "images/home/gathering-43.jpg", "w": 560, "h": 288, "n": "43"}, {"u": "images/home/gathering-44.jpg", "w": 560, "h": 420, "n": "44"}, {"u": "images/home/gathering-45.jpg", "w": 560, "h": 380, "n": "45"}, {"u": "images/home/gathering-46.jpg", "w": 360, "h": 560, "n": "46"}, {"u": "images/home/gathering-47.jpg", "w": 560, "h": 467, "n": "47"}, {"u": "images/home/gathering-48.jpg", "w": 373, "h": 560, "n": "48"}, {"u": "images/home/gathering-50.jpg", "w": 420, "h": 560, "n": "50"}, {"u": "images/home/gathering-51.jpg", "w": 560, "h": 349, "n": "51"}, {"u": "images/home/gathering-52.jpg", "w": 560, "h": 480, "n": "52"}, {"u": "images/home/gathering-53.jpg", "w": 420, "h": 560, "n": "53"}, {"u": "images/home/gathering-54.jpg", "w": 378, "h": 560, "n": "54"}, {"u": "images/home/gathering-55.jpg", "w": 160, "h": 200, "n": "55"}, {"u": "images/home/gathering-56.jpg", "w": 448, "h": 560, "n": "56"}, {"u": "images/home/gathering-57.jpg", "w": 560, "h": 374, "n": "57"}, {"u": "images/home/gathering-58.jpg", "w": 301, "h": 300, "n": "58"}, {"u": "images/home/gathering-59.jpg", "w": 424, "h": 560, "n": "59"}, {"u": "images/home/gathering-60.jpg", "w": 560, "h": 484, "n": "60"}, {"u": "images/home/gathering-61.jpg", "w": 560, "h": 560, "n": "61"}, {"u": "images/home/gathering-62.jpg", "w": 560, "h": 314, "n": "62"}, {"u": "images/home/gathering-63.jpg", "w": 420, "h": 560, "n": "63"}, {"u": "images/home/gathering-64.jpg", "w": 401, "h": 560, "n": "64"}, {"u": "images/home/gathering-65.jpg", "w": 560, "h": 560, "n": "65"}, {"u": "images/home/gathering-66.jpg", "w": 448, "h": 560, "n": "66"}, {"u": "images/home/gathering-67.jpg", "w": 560, "h": 560, "n": "67"}, {"u": "images/home/gathering-68.jpg", "w": 494, "h": 560, "n": "68"}, {"u": "images/home/gathering-69.jpg", "w": 418, "h": 560, "n": "69"}, {"u": "images/home/gathering-70.jpg", "w": 560, "h": 356, "n": "70"}, {"u": "images/home/gathering-71.jpg", "w": 297, "h": 355, "n": "71"}, {"u": "images/home/gathering-72.jpg", "w": 560, "h": 556, "n": "72"}, {"u": "images/home/gathering-73.jpg", "w": 426, "h": 560, "n": "73"}];</script>
<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const short = d => d.replace(/^(\w{3})\w*/, "$1");

  // Interviews: photo, title, who (company in magenta), date
  document.getElementById("list").innerHTML = CC.interviews.map(x => `
    <li class="row"><a href="${x.url}">
      <img class="ph" src="${PORTS[x.slug]}" alt="" width="56" height="56" loading="lazy" />
      <span class="t">${esc(x.headline)}</span>
      <span class="w"><b>${esc(x.name)}</b><br />${esc(x.role)}, <em>${esc(x.company)}</em></span>
      <span class="d">${short(x.date)}</span>
    </a></li>`).join("");

  // The stream: one dense wall of pictures and quotes that rides up through the stage on scroll; each piece fades in as it arrives
  const stage = document.getElementById("stage"), stream = document.getElementById("stream");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let wall, wallH = 0, vh = innerHeight;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
  function build() {
    vh = innerHeight; const w = innerWidth, n = w < 560 ? 2 : w < 900 ? 3 : w < 1300 ? 4 : 5, gap = 4, cell = (w - gap * (n - 1)) / n;
    wall = document.createElement("div"); wall.className = "wall";
    wall.style.gridTemplateColumns = `repeat(${n}, ${cell}px)`; wall.style.gridAutoRows = cell + "px";
    // Deal the quotes out evenly among the pictures
    const quotes = CC.interviews.filter(q => !["Earendil", "Oboe", "Paper"].includes(q.company));
    const sizes = ["q-xl", "q-w", "q-t", "q-w", "q-xl", "q-t", "q-w", "q-xl", "q-t"];
    const items = IMGS.map(im => ({ im })), step = items.length / quotes.length;
    quotes.forEach((q, i) => items.splice(Math.min(items.length, Math.round(step * i + step * .5)), 0, { q, size: sizes[i % sizes.length] }));
    items.forEach(it => {
      if (it.im) { const d = document.createElement("div"); const r = it.im.h / it.im.w; d.className = "pic" + (r > 1.3 ? " tall" : r < .62 && n > 2 ? " wide" : ""); d.innerHTML = `<img src="${it.im.u}" width="${it.im.w}" height="${it.im.h}" alt="" loading="lazy" />`; wall.appendChild(d); }
      else { const d = document.createElement("blockquote"); d.className = "quote " + it.size + (it.q.quote.length > 120 ? " long" : ""); d.innerHTML = `&ldquo;${esc(it.q.quote)}&rdquo;<small>${esc(it.q.name)}, ${esc(it.q.role)}, <em>${esc(it.q.company)}</em></small>`; wall.appendChild(d); }
    });
    stage.innerHTML = ""; stage.appendChild(wall);
    // Fill any holes so the wall ends on a complete row and every edge is flush
    const area = () => Array.from(wall.children).reduce((a, el) => a + (el.classList.contains("q-xl") ? 4 : el.classList.contains("wide") || el.classList.contains("tall") || el.classList.contains("q-w") || el.classList.contains("q-t") ? 2 : 1), 0);
    for (let k = 0; k < 40; k++) {
      const rows = Math.round((wall.offsetHeight + gap) / (cell + gap)), holes = rows * n - area();
      if (holes <= 0) break;
      const im = IMGS[(k * 11 + 5) % IMGS.length], d = document.createElement("div"); d.className = "pic";
      d.innerHTML = `<img src="${im.u}" width="${im.w}" height="${im.h}" alt="" loading="lazy" />`; wall.appendChild(d);
    }
    wallH = wall.offsetHeight;
    // Scroll distance: the wall moves a little faster than the page, so it streams
    stream.style.height = reduce ? "auto" : Math.max(vh * 2.5, (wallH - vh) * .6 + vh) + "px";
    wall.querySelectorAll(".pic, .quote").forEach(el => io.observe(el));
    if (!reduce) place();
  }
  let ticking = false;
  function place() {
    const top = stream.offsetTop, p = Math.min(1, Math.max(0, (scrollY - top) / (stream.offsetHeight - vh)));
    wall.style.transform = `translate3d(0, ${-p * Math.max(0, wallH - vh)}px, 0)`;
    document.body.classList.toggle("past", scrollY > vh * .6);
    ticking = false;
  }
  build();
  addEventListener("scroll", () => { if (!ticking && !reduce) { ticking = true; requestAnimationFrame(place); } else if (reduce) document.body.classList.toggle("past", scrollY > vh * .6); }, { passive: true });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 150); });
  addEventListener("load", () => { wallH = wall.offsetHeight; });
</script>
