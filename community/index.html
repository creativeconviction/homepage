ostly beautiful landscapes…", "cap": false}, "25": {"slug": "liz-dorman", "q": "Liz Dorman owns more than a hundred old phones. There is a 1970s Bell telephone, a set of Barbie phones from the ’80s, Siemens handsets released in seasonal collections like clothing, and her prized piece: a hot pink Motorola Razr.", "cap": true, "frag": "There is a 1970s Bell telephone"}, "28": {"slug": "noah-kerner", "q": "I would spend a couple hours with Michael Lang, who started Woodstock, or Ahmet Ertegun, who founded Atlantic Records, or Richard Meier, the architect, or Tom Ford.", "cap": false}, "29": {"slug": "noah-kerner", "q": "My wife and I started an art organization called Give Kids Art, and the message is “Create Fearlessly.” The founding ethos is based on another quote, this one from Picasso: “Every child is born an artist.", "cap": false}, "31": {"slug": "liz-dorman", "q": "I really love Lego. It’s an incredible brand that enables so much creativity, at all scales.", "cap": false}, "33": {"slug": "liz-dorman", "q": "I think we will see dozens of computing device companies, all happily co-existing.", "cap": false}, "34": {"slug": "liz-dorman", "q": "I think we will see dozens of computing device companies, all happily co-existing.", "cap": false}, "38": {"slug": "colin-daymond-hanna", "q": "Ramiz has done a lot with the Tetris animation. We get millions of hits to that site per week, and at one point the animation was taking too long, so I took time to re-optimize it.", "cap": false}, "40": {"slug": "quinten-farmer", "q": "The third piece, around the same exploration time, was that we lucked into getting to know a really talented creative director, Lucas Zanotto, through my friend, Zach Klein.", "cap": false}, "41": {"slug": "liz-dorman", "q": "I care so much about Era creating spaces for people from all backgrounds to make this future world of computing together.", "cap": false}, "43": {"slug": "adam-ho", "q": "Somewhat unique to fal, we have a function called creative engineers, who create workflows for generative imaging.", "cap": false}, "44": {"slug": "diego-segura", "q": "If I could give any founder one piece of advice, it would be: write the thing in extreme detail first, then go talk to the designers.", "cap": false}, "45": {"slug": "quinten-farmer", "q": "Today we call it a second self. It’s personal AI, a little character designed to be an extension of you.", "cap": false}, "47": {"slug": "nir-zicherman", "q": "And yet those billions of people online clearly have things they’re intrinsically motivated to learn, because they keep going down rabbit holes.", "cap": false}, "48": {"slug": "paul-jun", "q": "At scale, every company desires the work to perform like a symphony. Eighty musicians can play different notes and still create one piece because they share a score.", "cap": false}, "50": {"slug": "adam-ho", "q": "GenMedia Conference tote, made at fal design lab with Hyunjung Lee. Nearly every element was made from scratch: custom-dyed light sage nylon, a custom 8mm cord, a fal logo silver carabiner.", "cap": true, "frag": "custom-dyed light sage nylon"}, "51": {"slug": "liz-dorman", "q": "Architecture is such a perfect metaphor for computing. We inhabit it every day, it influences how we think and connect, and it responds very quickly to the technological advancement enabling it.", "cap": false}, "52": {"slug": "adam-ho", "q": "There’s Karel Martens, a Dutch graphic designer. There’s Wang Zhihong, a brilliant Taiwanese graphic designer.", "cap": false}, "53": {"slug": "adam-ho", "q": "GenMedia Conference tote, made at fal design lab with Hyunjung Lee. Nearly every element was made from scratch: custom-dyed light sage nylon, a custom 8mm cord, a fal logo silver carabiner.", "cap": true, "frag": "custom-dyed light sage nylon"}, "54": {"slug": "liz-dorman", "q": "I particularly love Archigram and the Metabolists, avant-garde groups in the UK and Japan that imagined buildings as organisms: modular buildings that change and rotate based on the needs of the inhabitants, so you’d come back and the building would look different.", "cap": false}, "61": {"slug": "liz-dorman", "q": "Liz Dorman owns more than a hundred old phones. There is a 1970s Bell telephone, a set of Barbie phones from the ’80s, Siemens handsets released in seasonal collections like clothing, and her prized piece: a hot pink Motorola Razr.", "cap": true, "frag": "There is a 1970s Bell telephone"}, "62": {"slug": "mihika-kapoor", "q": "I also love large scale, so the Monet paintings in the Musée de l’Orangerie, which make you feel like a dot.", "cap": false}, "64": {"slug": "adam-ho", "q": "There’s a painter named Stanley Whitney. He’s a master of colors.", "cap": false}, "65": {"slug": "adam-ho", "q": "There’s a painter named Stanley Whitney. He’s a master of colors.", "cap": false}, "66": {"slug": "adam-ho", "q": "There’s a painter named Stanley Whitney. He’s a master of colors.", "cap": false}, "71": {"slug": "mihika-kapoor", "q": "So now we are hiring brand designers, motion animators, storytellers, pixel artists, you name it.", "cap": false}, "72": {"slug": "mihika-kapoor", "q": "So now we are hiring brand designers, motion animators, storytellers, pixel artists, you name it.", "cap": false}, "73": {"slug": "paul-jun", "q": "It’s like a video game finally getting a patch that everyone has been waiting for.", "cap": false}, "s-globs": {"slug": "steve-ruiz", "q": "A year of posting works-in-progress on Twitter led to a design tool I built named globs and an algorithm for freehand ink.", "cap": false}, "s-tldraw-offline": {"slug": "steve-ruiz", "q": "Then it turned into, let’s just build a canvas. Something like Figma’s canvas, but open source and on the web.", "cap": false}, "s-style-panel": {"slug": "steve-ruiz", "q": "What does good ink feel like? What do good arrows feel like?", "cap": false}, "s-roman-road": {"slug": "steve-ruiz", "q": "I was a painter. Mostly beautiful landscapes…", "cap": false}, "s-negril-slides":
